{{- $fullname := include "redis-sentinel.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-sentinel
  labels:
    {{- include "redis-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: sentinel
spec:
  # selector and serviceName are immutable: keep them stable across chart versions
  serviceName: {{ $fullname }}-sentinel
  replicas: {{ .Values.sentinel.replicas }}
  selector:
    matchLabels:
      {{- include "redis-sentinel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sentinel
  template:
    metadata:
      labels:
        {{- include "redis-sentinel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sentinel
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "redis-sentinel.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: config-init
        image: {{ include "redis-sentinel.sentinel.image" . }}
        imagePullPolicy: {{ .Values.sentinel.image.pullPolicy }}
        command:
        - sh
        - /opt/scripts/init-sentinel.sh
        env:
        {{- include "redis-sentinel.scriptEnv" . | nindent 8 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: sentinel-config-readonly
          mountPath: /opt/sentinel-readonly
        - name: scripts
          mountPath: /opt/scripts
        - name: sentinel-data
          mountPath: /data
      containers:
      - name: sentinel
        image: {{ include "redis-sentinel.sentinel.image" . }}
        imagePullPolicy: {{ .Values.sentinel.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - containerPort: 26379
          name: sentinel
        command:
        - redis-sentinel
        - /data/sentinel.conf
        {{- with (include "redis-sentinel.sentinel.passwordEnv" .) }}
        env:
          {{- . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: sentinel-data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.sentinel.resources | nindent 10 }}
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            # REDISCLI_AUTH is not set in this container, so pass the Sentinel password explicitly
            - REDISCLI_AUTH="$SENTINEL_PASSWORD"; [ -n "$REDISCLI_AUTH" ] && export REDISCLI_AUTH; redis-cli -p 26379 ping | grep -q PONG
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            # REDISCLI_AUTH is not set in this container, so pass the Sentinel password explicitly
            - REDISCLI_AUTH="$SENTINEL_PASSWORD"; [ -n "$REDISCLI_AUTH" ] && export REDISCLI_AUTH; redis-cli -p 26379 ping | grep -q PONG
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      - name: cleanup
        image: {{ include "redis-sentinel.sentinel.image" . }}
        imagePullPolicy: {{ .Values.sentinel.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        command:
        - sh
        - /opt/scripts/sentinel-cleanup.sh
        env:
        {{- include "redis-sentinel.scriptEnv" . | nindent 8 }}
        volumeMounts:
        - name: scripts
          mountPath: /opt/scripts
        resources:
          {{- toYaml .Values.sentinel.cleanupResources | nindent 10 }}
      volumes:
      - name: sentinel-config-readonly
        configMap:
          name: {{ $fullname }}-sentinel-config
      - name: scripts
        configMap:
          name: {{ $fullname }}-scripts
      - name: sentinel-data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "redis-sentinel.affinity" (dict "ctx" $ "component" "sentinel")) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
