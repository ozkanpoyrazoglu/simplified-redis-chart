{{- if or .Values.redis.auth.enabled .Values.sentinel.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis-sentinel.fullname" . }}-auth
  labels:
    {{- include "redis-sentinel.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.redis.auth.enabled }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.sentinel.auth.enabled }}
  sentinel-password: {{ include "redis-sentinel.sentinel.password" . | b64enc | quote }}
  {{- end }}
  {{- if .Values.redis.auth.acl.enabled }}
  {{- range .Values.redis.auth.acl.users }}
  {{ .username }}-password: {{ .password | b64enc | quote }}
  {{- end }}
  {{- $acl := list (printf "user default on >%s ~* &* +@all" .Values.redis.auth.password) }}
  {{- range .Values.redis.auth.acl.users }}
  {{- if eq .username "default" }}
  {{- fail "redis.auth.acl.users must not contain \"default\"; its password is redis.auth.password" }}
  {{- end }}
  {{- $rule := printf "user %s on >%s" .username .password }}
  {{- with .keys }}{{ $rule = printf "%s %s" $rule . }}{{ end }}
  {{- with .channels }}{{ $rule = printf "%s %s" $rule . }}{{ end }}
  {{- $acl = append $acl (printf "%s %s" $rule .permissions) }}
  {{- end }}
  acl.conf: {{ printf "%s\n" (join "\n" $acl) | b64enc | quote }}
  {{- end }}
{{- end }}
